<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#060C1A}
    @keyframes alb-bar{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
  </style>
</helmet>
<div style="position:relative;width:100%;min-height:100vh;background:#060C1A;font-family:Inter,sans-serif;overflow:hidden">

  <!-- revealed page behind the splash -->
  <div style="position:absolute;inset:0;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:28px 48px;border-bottom:1px solid #1A2B4A">
      <img src="assets/logo-albatros-white.png" alt="Albatros Health Care" style="height:30px;width:auto"/>
      <div style="display:flex;gap:34px;color:#7A8FB8;font-size:14px;font-weight:500">
        <span style="color:#EEF2FF">Главная</span><span>Каталог</span><span>О компании</span><span>Контакты</span>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 48px;max-width:1100px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;color:#3E8FA6;margin-bottom:22px">ЛАБОРАТОРНАЯ ДИАГНОСТИКА · С 2017</div>
      <h1 style="font-family:Syne,sans-serif;font-weight:800;font-size:58px;line-height:1.04;color:#EEF2FF;margin:0;max-width:760px;text-wrap:balance">Премиальное оборудование для&nbsp;точной диагностики</h1>
      <p style="color:#7A8FB8;font-size:18px;line-height:1.6;max-width:560px;margin:24px 0 0">Официальный дистрибьютор мировых брендов в Узбекистане. Поставка, ввод в эксплуатацию и сервис под ключ.</p>
    </div>
  </div>

  <!-- splash overlay -->
  <div ref="{{ splashRef }}" style="position:fixed;inset:0;z-index:50;background:#060C1A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
    <img ref="{{ logoRef }}" src="assets/logo-albatros-white.png" alt="Albatros Health Care" style="height:64px;width:auto;opacity:0"/>
    <canvas ref="{{ canvasRef }}" style="width:760px;max-width:86vw;height:200px;display:block"></canvas>
    <div style="width:220px;height:2px;border-radius:2px;background:#111E38;overflow:hidden;position:relative">
      <div style="position:absolute;top:0;left:0;height:100%;width:42%;border-radius:2px;background:linear-gradient(90deg,transparent,#2E549C 35%,#ED1C24 65%,transparent);animation:alb-bar 1.25s ease-in-out infinite"></div>
    </div>
  </div>

  <!-- replay control (revealed after fade) -->
  <button onClick="{{ replay }}" style="position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid #1A2B4A;background:#0C1628;color:#7A8FB8;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;cursor:pointer">↻ повторить заставку</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // stable ref handlers — ignore null calls so element refs survive re-renders
  setSplash = (el) => { if (el) this.splash = el; };
  setLogo   = (el) => { if (el) this.logo = el; };
  setCanvas = (el) => { if (el) { this.canvas = el; this.setupCanvas(); } };

  renderVals() {
    return {
      splashRef: this.setSplash,
      logoRef: this.setLogo,
      canvasRef: this.setCanvas,
      replay: () => this.run(),
    };
  }

  componentDidMount() {
    this.palette = {
      blue: [46, 84, 156], blueLt: [92, 127, 180],
      red: [208, 24, 31], redLt: [237, 28, 36],
      teal: [62, 143, 166],
    };
    this.setupCanvas();
    this._onResize = () => this.setupCanvas();
    window.addEventListener('resize', this._onResize);
    this.run();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.fadeT);
    window.removeEventListener('resize', this._onResize);
  }

  setupCanvas() {
    if (!this.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = this.canvas.getBoundingClientRect();
    this.cw = r.width || 760; this.ch = r.height || 200;
    this.canvas.width = Math.round(this.cw * dpr);
    this.canvas.height = Math.round(this.ch * dpr);
    this.ctx = this.canvas.getContext('2d');
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  run() {
    cancelAnimationFrame(this.raf);
    if (this.splash) {
      this.splash.style.opacity = '1';
      this.splash.style.visibility = 'visible';
      this.splash.style.pointerEvents = 'auto';
    }
    if (this.logo) { this.logo.style.opacity = '0'; }
    this.start = performance.now();
    const clamp = (v) => Math.max(0, Math.min(1, v));

    const loop = (now) => {
      const t = (now - this.start) / 1000;
      this.draw(t);

      // logo reveal (driven by rAF elapsed time — robust in the preview)
      if (this.logo) {
        const lp = clamp((t - 0.12) / 0.9);
        const e = 1 - Math.pow(1 - lp, 3);
        this.logo.style.opacity = String(e);
        this.logo.style.transform = 'translateY(' + ((1 - e) * 14).toFixed(2) + 'px)';
      }

      // splash fade-out after 2.7s
      if (this.splash) {
        if (t < 2.7) {
          this.splash.style.opacity = '1';
        } else {
          const fp = clamp((t - 2.7) / 0.8);
          this.splash.style.opacity = String(1 - fp);
          if (fp >= 1) {
            this.splash.style.visibility = 'hidden';
            this.splash.style.pointerEvents = 'none';
          }
        }
      }

      if (t < 3.7) this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }

  draw(t) {
    const ctx = this.ctx; if (!ctx) return;
    const w = this.cw, h = this.ch, cy = h / 2;
    const P = this.palette;
    ctx.clearRect(0, 0, w, h);

    const periods = 2.6;
    const amp = h * 0.34;
    const N = 52;
    const phase = t * 1.7;
    const lerp = (a, b, m) => a + (b - a) * m;
    const mix = (c1, c2, m) => [lerp(c1[0],c2[0],m),lerp(c1[1],c2[1],m),lerp(c1[2],c2[2],m)];
    const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

    const nodes = [];
    for (let i = 0; i < N; i++) {
      const fx = i / (N - 1);
      const x = 8 + fx * (w - 16);
      const theta = fx * periods * Math.PI * 2 + phase;
      const zA = Math.cos(theta);
      const yA = cy + amp * Math.sin(theta);
      const yB = cy - amp * Math.sin(theta);
      const rev = Math.max(0, Math.min(1, (t - 0.15 - fx * 0.55) / 0.45));
      nodes.push({ x, yA, yB, zA, rev });
    }

    ctx.lineWidth = 1.4;
    ctx.setLineDash([2, 4]);
    for (const n of nodes) {
      if (n.rev <= 0) continue;
      const depth = Math.abs(n.zA);
      ctx.strokeStyle = rgba(P.teal, 0.10 + 0.28 * (1 - depth) * n.rev);
      ctx.beginPath();
      ctx.moveTo(n.x, n.yA);
      ctx.lineTo(n.x, n.yB);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    const beads = [];
    for (const n of nodes) {
      if (n.rev <= 0) continue;
      beads.push({ x: n.x, y: n.yA, z: n.zA, rev: n.rev, strand: 'A' });
      beads.push({ x: n.x, y: n.yB, z: -n.zA, rev: n.rev, strand: 'B' });
    }
    beads.sort((a, b) => a.z - b.z);
    for (const b of beads) {
      const dn = (b.z + 1) / 2;
      const r = (2.6 + 4.6 * dn) * b.rev;
      const a = (0.25 + 0.7 * dn) * b.rev;
      const col = b.strand === 'A' ? mix(P.blue, P.blueLt, dn) : mix(P.red, P.redLt, dn);
      if (dn > 0.55) {
        ctx.beginPath();
        ctx.fillStyle = rgba(col, 0.12 * b.rev);
        ctx.arc(b.x, b.y, r * 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.fillStyle = rgba(col, a);
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
</script>
</body>
</html>
