<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#060C1A}
    .alb-card{transition:transform .28s cubic-bezier(.2,.7,.2,1),border-color .28s ease,background .28s ease}
    .alb-card:hover{transform:translateY(-6px);border-color:#2E549C !important;background:#111E38 !important}
    .alb-card:hover .alb-go{opacity:1;transform:translateX(0)}
    .alb-card:hover .alb-photo img{transform:scale(1.045)}
    .alb-go{opacity:0;transform:translateX(-6px);transition:opacity .28s ease,transform .28s ease}
    .alb-photo img{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
  </style>
</helmet>
<div style="width:100%;min-height:100vh;background:#060C1A;font-family:Inter,sans-serif;padding:80px 48px 96px">
  <div style="max-width:1280px;margin:0 auto">

    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:48px">
      <div style="flex:1 1 520px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;color:#3E8FA6;margin-bottom:18px">18 НАПРАВЛЕНИЙ</div>
        <h2 style="font-family:Syne,sans-serif;font-weight:800;font-size:46px;line-height:1.05;color:#EEF2FF;margin:0">Направления диагностики</h2>
      </div>
      <p style="flex:1 1 320px;color:#7A8FB8;font-size:16px;line-height:1.6;max-width:420px;margin:0">Полный парк решений — от иммунохимии и гематологии до молекулярной диагностики и автоматизированных лабораторных линий.</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:18px">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="12">
        <a href="#" class="alb-card" style="display:flex;flex-direction:column;text-decoration:none;background:#0C1628;border:1px solid #1A2B4A;border-radius:14px;overflow:hidden">
          <div class="alb-photo" style="position:relative;height:158px;background:radial-gradient(120% 120% at 50% 38%,#ffffff 0%,#eef1f7 70%,#e4e9f3 100%);overflow:hidden">
            <img src="{{ item.img }}" alt="{{ item.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px"/>
          </div>
          <div style="padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;flex:1">
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:#3E8FA6">{{ item.brand }}</div>
            <div style="font-family:Syne,sans-serif;font-weight:700;font-size:18px;line-height:1.2;color:#EEF2FF">{{ item.name }}</div>
            <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#7A8FB8">{{ item.count }} позиций</span>
              <span class="alb-go" style="font-size:13px;font-weight:600;color:#5C7FB4">Смотреть →</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'ИХЛА',                          brand: 'SNIBE · Maglumi',      count: 12, img: 'assets/dir/ihla.png' },
        { name: 'Биохимия',                       brand: 'SNIBE · Biossays',     count: 9,  img: 'assets/dir/biochem.png' },
        { name: 'Гемостаз',                       brand: 'Werfen · ACL TOP',     count: 6,  img: 'assets/dir/hemostasis.webp' },
        { name: 'Гематология',                    brand: 'Dymind · DH',          count: 11, img: 'assets/dir/hematology.webp' },
        { name: 'Микробиология',                  brand: 'BD · BACTEC',          count: 7,  img: 'assets/dir/microbiology.avif' },
        { name: 'ПЦР',                            brand: 'SNIBE · Molecision',   count: 8,  img: 'assets/dir/pcr.jpg' },
        { name: 'Аллергология',                   brand: 'Phadia',               count: 4,  img: 'assets/dir/allergology.jpg' },
        { name: 'КЩС',                            brand: 'Werfen · GEM',         count: 5,  img: 'assets/dir/blood-gas.png' },
        { name: 'ВЭЖХ',                           brand: 'Lifotronic · H8',      count: 3,  img: 'assets/dir/hplc.png' },
        { name: 'Клинический анализ',             brand: 'URIT · US',            count: 6,  img: 'assets/dir/clinical-urine.jpg' },
        { name: 'Генетика',                       brand: 'Illumina · MiSeq',     count: 3,  img: 'assets/dir/genetics.jpg' },
        { name: 'Функциональная диагностика',     brand: 'Clarius',              count: 7,  img: 'assets/dir/functional.webp' },
        { name: 'Контроль качества',              brand: 'Randox · Evidence',    count: 5,  img: 'assets/dir/qc.webp' },
        { name: 'Биодеконтаминация',              brand: 'addcare · Blozer',     count: 4,  img: 'assets/dir/biodecontam.webp' },
        { name: 'Автоматизированная лаборатория', brand: 'SNIBE · Biolumi',      count: 2,  img: 'assets/dir/automation.png' },
        { name: 'Иммуногематология',              brand: 'SNIBE · Maglumi',      count: 4,  img: 'assets/dir/immunohematology.png' },
        { name: 'Токсикология',                   brand: 'Satlars',              count: 5,  img: 'assets/dir/toxicology.jpg' },
        { name: 'Клиническая диагностика',        brand: 'Dymind · DF',          count: 8,  img: 'assets/dir/clinical-dx.png' },
      ],
    };
  }
}
</script>
</body>
</html>
